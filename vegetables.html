<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F5">
<title>Vegetables · Delivery App</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<main class="screen">
  <div class="scroll">
    <div class="illustration" aria-hidden="true"></div>

    <div class="nav">
      <a class="back" href="index.html" aria-label="Back to categories">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
    </div>

    <h1 class="large-title small">Vegetables</h1>

    <label class="search">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="visually-hidden">Search vegetables</span>
      <input type="search" id="q" placeholder="Search" autocomplete="off">
    </label>

    <div class="chips" role="group" aria-label="Vegetable types">
      <div class="chip-rows">
        <div class="chip-row">
          <button type="button" class="chip" aria-pressed="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Cabbage and lettuce (14)</button>
          <button type="button" class="chip" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Cucumbers and tomatoes (10)</button>
        </div>
        <div class="chip-row">
          <button type="button" class="chip" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Onions and garlic (8)</button>
          <button type="button" class="chip" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Peppers (7)</button>
          <button type="button" class="chip" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Potatoes and carrots (4)</button>
        </div>
      </div>
    </div>

    <div class="items" id="items"></div>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="index.html" aria-label="Categories" aria-current="page">
      <svg class="grid-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </a>
    <button type="button" class="tab tab-cart" aria-label="Cart">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="badge" hidden>0</span>
    </button>
    <button type="button" class="tab" aria-label="Profile">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </nav>
</main>

<script>
(function () {
  // To use real photos, put image files in images/ and set `image` below, e.g. image: 'images/boston-lettuce.jpg'
  var products = [
    { id: 'lettuce', name: 'Boston Lettuce', price: '1.10', unit: '€ / piece', image: '' },
    { id: 'cauliflower', name: 'Purple Cauliflower', price: '1.85', unit: '€ / kg', image: '' },
    { id: 'savoy', name: 'Savoy Cabbage', price: '1.45', unit: '€ / kg', image: '' }
  ];
  var favs = {};
  var list = document.getElementById('items');
  var q = document.getElementById('q');

  var heart = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  var cartIcon = '<svg class="icon-cart" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>';
  var checkIcon = '<svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function render() {
    var cart = DeliveryApp.readCart();
    var needle = q.value.trim().toLowerCase();
    var shown = products.filter(function (p) { return !needle || p.name.toLowerCase().indexOf(needle) !== -1; });
    if (!shown.length) {
      list.innerHTML = '<p class="empty">No vegetables match “' + esc(q.value) + '”</p>';
      return;
    }
    list.innerHTML = shown.map(function (p) {
      var isFav = !!favs[p.id];
      var inCart = !!cart[p.id];
      var photo = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '">' : esc(p.name) + ' photo';
      return '<div class="item">' +
        '<div class="photo">' + photo + '</div>' +
        '<div class="info">' +
          '<div class="name">' + esc(p.name) + '</div>' +
          '<div class="price"><b>' + esc(p.price) + '</b><span>' + esc(p.unit) + '</span></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn btn-outline" data-fav="' + p.id + '" aria-pressed="' + isFav + '" aria-label="' + (isFav ? 'Remove ' + esc(p.name) + ' from favorites' : 'Save ' + esc(p.name) + ' to favorites') + '">' + heart + '</button>' +
            '<button type="button" class="btn btn-primary' + (inCart ? ' in-cart' : '') + '" data-cart="' + p.id + '" aria-label="' + (inCart ? 'Remove ' + esc(p.name) + ' from cart' : 'Add ' + esc(p.name) + ' to cart') + '">' + cartIcon + checkIcon + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  list.addEventListener('click', function (e) {
    var fav = e.target.closest('[data-fav]');
    var add = e.target.closest('[data-cart]');
    if (fav) { favs[fav.dataset.fav] = !favs[fav.dataset.fav]; render(); }
    if (add) {
      var cart = DeliveryApp.readCart();
      cart[add.dataset.cart] = !cart[add.dataset.cart];
      DeliveryApp.writeCart(cart);
      DeliveryApp.updateBadge(cart);
      render();
    }
  });

  document.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'); });
    });
  });

  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
